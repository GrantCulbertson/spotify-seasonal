name: Seasonal Playlist Creator

on:
  schedule:
    - cron: '0 9 1 3,6,9,12 *'
  workflow_dispatch:
    inputs:
      season:
        description: 'Season override (e.g. Spring''26, Summer''26). Leave blank to use the current ended season.'
        required: false
        default: ''

jobs:
  create-playlist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Create seasonal playlist, generate narrative, send email
        run: |
          SEASON_ARG=""
          if [ -n "${{ github.event.inputs.season }}" ]; then
            SEASON_ARG="--season=${{ github.event.inputs.season }}"
          fi
          npx tsx scripts/seasonal-playlist.ts $SEASON_ARG
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_TO_EMAIL: ${{ secrets.RESEND_TO_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
